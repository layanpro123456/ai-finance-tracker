name: Build Apex Location Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-companion/**'
      - '.github/workflows/build-tracker-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Ensure Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-root-directory: android-companion

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android-companion/gradlew || true

      - name: Build Debug APK with Gradle
        working-directory: android-companion
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace -Pandroid.useAndroidX=true
          else
            gradle assembleDebug --stacktrace -Pandroid.useAndroidX=true
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-location-tracker-debug-apk
          path: android-companion/app/build/outputs/apk/debug/*.apk
          retention-days: 30
