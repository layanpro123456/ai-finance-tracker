<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#091528" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald-to-Teal Apex Primary Gradient -->
    <linearGradient id="apexEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Neon Cyber Accent Gradient -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Rounded Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Behind Apex Symbol -->
  <circle cx="32" cy="30" r="14" fill="#10b981" opacity="0.25" filter="url(#glow)" />

  <!-- Outer Apex Crest (Upward Summit Chevron / Delta A) -->
  <path d="M32 9 L51 45 C51 45 44 41 32 46 C20 41 13 45 13 45 Z" fill="url(#apexEmerald)" />

  <!-- Inner Negative Core Carve (Dimensional Layering) -->
  <path d="M32 21 L43 43 C39 40.5 35 41 32 41 C29 41 25 40.5 21 43 Z" fill="#020617" />

  <!-- Central Kinetic Spark / Diamond Telemetry Core -->
  <path d="M32 23 L37 32 L32 37 L27 32 Z" fill="url(#accentCyan)" />

  <!-- Floating North Star / Summit Beacon Pin -->
  <circle cx="32" cy="11.5" r="2.2" fill="#a7f3d0" />
  <circle cx="32" cy="11.5" r="4.5" stroke="#34d399" stroke-width="0.8" opacity="0.6" />
</svg>