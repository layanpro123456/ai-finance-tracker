<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex LifeOS — Redirecting...</title>
    <script>
      // Single Page Application (SPA) Fallback Router for GitHub Pages
      // Ensures auth verification callbacks (e.g., /auth/confirm, /callback, /verify)
      // are gracefully routed back to index.html with all query parameters and hash fragments intact.
      (function() {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // If hosted on GitHub Pages under a project directory (e.g., /ai-finance-tracker/)
        var repoMatch = path.match(/^\/([^/]+)/);
        var base = '/';

        if (window.location.hostname.endsWith('github.io') && repoMatch) {
          base = '/' + repoMatch[1] + '/';
        }

        var targetUrl = window.location.origin + base + search + hash;
        window.location.replace(targetUrl);
      })();
    </script>
    <style>
      body {
        background-color: #020617;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .title {
        color: #f8fafc;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .subtitle {
        color: #64748b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div class="title">Apex LifeOS</div>
    <div class="subtitle">Redirecting to dashboard...</div>
  </body>
</html>
